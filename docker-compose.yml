services:
  postgres:
    image: postgres:15
    container_name: goauth_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: goauthdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d goauthdb"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: